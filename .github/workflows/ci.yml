name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-syntax:
    name: Backend — Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
      uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q backend

  backend-unit-tests:
    name: Backend — Unit Tests
    runs-on: ubuntu-latest
    needs: backend-syntax
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Run backend tests (if present)
        run: |
          if find backend/tests -type f \( -name "test_*.py" -o -name "*_test.py" \) | grep -q .; then
            pytest -q backend/tests
          else
            echo "No backend test files found under backend/tests; add tests to strengthen this check."
          fi

  mobile-lint:
    name: Mobile — Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci --prefix mobile

      - name: Run mobile lint
        run: npm run lint --prefix mobile

  mobile-typecheck:
    name: Mobile — Type Check
    runs-on: ubuntu-latest
    needs: mobile-lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci --prefix mobile

      - name: Run mobile typecheck
        run: npm run typecheck --prefix mobile

  mobile-build-verify:
    name: Mobile — Build Verification (Expo Web Export)
    runs-on: ubuntu-latest
    needs: mobile-typecheck
    env:
      CI: "true"
      EXPO_PUBLIC_API_URL: "http://localhost:5000"
      EXPO_PUBLIC_API_VERSION: "v1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci --prefix mobile

      - name: Verify Expo web export
        run: npx --yes expo export --platform web --non-interactive
        working-directory: mobile
