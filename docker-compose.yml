services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: morafek-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    # Wait for gpas and gics to be responding before the backend starts.
    # Without this, patient registration fires gpas.get_or_create() while
    # gPAS is still booting → returns None → pseudonym stored as null.
    depends_on:
      mysql:
        condition: service_healthy
      gpas:
        # service_started (not service_healthy) so `docker compose up -d` returns
        # promptly without blocking for WildFly's 90-120 s boot.
        # The backend code handles gPAS/gICS being temporarily unavailable
        # gracefully — null pseudonym on registration is retried on first consent grant.
        condition: service_started
      gics:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./mobile
      dockerfile: Dockerfile
      args:
        EXPO_PUBLIC_API_URL: http://localhost:5000
        EXPO_PUBLIC_API_VERSION: v1
        GEMINI_API_KEY: ${GEMINI_API_KEY}
    container_name: morafek-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy

  mysql:
    image: mariadb:10.11
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: gpas_root
      MYSQL_DATABASE: gpas
      MYSQL_USER: gpas_user
      MYSQL_PASSWORD: gpas_pass
    # --innodb-use-native-aio=0 disables io_uring / native AIO, which the host
    # kernel blocks with EPERM when sysctl kernel.io_uring_disabled=2 is set.
    # Without this flag mariadbd aborts on startup in hardened container runtimes.
    command: >
      --innodb-use-native-aio=0
    volumes:
      - gpas-db-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./mysql.cnf:/etc/mysql/conf.d/gpas.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pgpas_root", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  gpas:
    image: mosaicgreifswald/gpas:latest
    container_name: gpas
    # restart: unless-stopped is the key mechanism here.
    # gPAS boots, may crash on the first run because schema columns are too
    # narrow, then gpas-schema-fix widens them, then gPAS auto-restarts and
    # boots successfully. The schema-fix MUST NOT be a depends_on prerequisite
    # because it polls for a table that gPAS creates — making each wait for
    # the other causes a deadlock.
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      TTP_DB_HOST: mysql
      TTP_DB_PORT: 3306
      TTP_DB_NAME: gpas
      TTP_DB_USER: gpas_user
      TTP_DB_PASS: gpas_pass
      WILDFLY_DISABLE_SSL: "true"
    # gPAS (WildFly) takes 60-90 s to boot; give it plenty of start_period
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/gpas/gpasService?wsdl"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s

  gpas-schema-fix:
    image: mariadb:10.11
    container_name: gpas-schema-fix
    # restart: on-failure retries if polling times out before gPAS creates its
    # tables (e.g. slow first boot).  There is no max_attempts here because
    # deploy.restart_policy is Swarm-only and is silently ignored in Compose;
    # the plain restart: on-failure is what actually governs retries.
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      bash -c "
        echo 'Polling for gPAS domain table...' &&
        until mariadb -h mysql -uroot -pgpas_root gpas -e 'DESCRIBE domain' 2>/dev/null; do
          echo '  not yet, retrying in 5s...' && sleep 5;
        done &&
        echo 'Table found — waiting 10s for gPAS DDL phase to finish before ALTER...' &&
        sleep 10 &&
        echo 'Widening gPAS columns...' &&
        mariadb -h mysql -uroot -pgpas_root gpas -e \"
          ALTER TABLE domain MODIFY COLUMN properties             MEDIUMTEXT;
          ALTER TABLE domain MODIFY COLUMN COMMENT               MEDIUMTEXT;
          ALTER TABLE domain MODIFY COLUMN expiration_properties MEDIUMTEXT;
          ALTER TABLE domain MODIFY COLUMN LABEL                 VARCHAR(768);
          ALTER TABLE psn    MODIFY COLUMN PSEUDONYM             VARCHAR(500);
          ALTER TABLE mpsn   DROP PRIMARY KEY;
          ALTER TABLE mpsn
            MODIFY COLUMN PSEUDONYM             VARCHAR(500)
            CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          ALTER TABLE mpsn
            ADD PRIMARY KEY (DOMAIN_NAME(191), PSEUDONYM(500));
        \" &&
        echo 'Schema widened. gPAS will use correct column widths on next write.'
      "

  gics:
    image: mosaicgreifswald/gics:latest
    container_name: gics
    # Same restart-based pattern as gPAS — see comment above.
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8082:8080"
    environment:
      TTP_DB_HOST: mysql
      TTP_DB_PORT: 3306
      TTP_DB_NAME: gics
      TTP_DB_USER: gpas_user
      TTP_DB_PASS: gpas_pass
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/gics/gicsService?wsdl"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s

  gics-schema-fix:
    image: mariadb:10.11
    container_name: gics-schema-fix
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      bash -c "
        echo 'Polling for gICS consent table...' &&
        until mariadb -h mysql -uroot -pgpas_root gics -e 'DESCRIBE consent' 2>/dev/null; do
          echo '  not yet, retrying in 5s...' && sleep 5;
        done &&
        echo 'Table found — waiting 10s for gICS DDL phase to finish before ALTER...' &&
        sleep 10 &&
        echo 'Widening gICS columns...' &&
        mariadb -h mysql -uroot -pgpas_root gics -e \"
          ALTER TABLE consent     MODIFY COLUMN comment   MEDIUMTEXT;
          ALTER TABLE policy      MODIFY COLUMN comment   MEDIUMTEXT;
          ALTER TABLE qc_problem  MODIFY COLUMN comment   MEDIUMTEXT;
          ALTER TABLE qc_problem  MODIFY COLUMN solution  MEDIUMTEXT;
        \" 2>/dev/null || true &&
        echo 'gICS schema fix done.'
      "

volumes:
  gpas-db-data:
